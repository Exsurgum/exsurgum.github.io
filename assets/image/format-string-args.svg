<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">
<title>格式化字符串参数读取顺序示意图</title>
<desc>x86-64 System V ABI 下，printf 先从左到右读取 rdi 至 r9 寄存器中的前六个参数槽位，r9 用尽后沿箭头进入调用栈，从低地址向高地址读取栈槽，最终进入 buf 所在区域。</desc>
<rect width="1200" height="920" fill="#ffffff"/>
<text x="60" y="67" fill="#172b4d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="600" text-anchor="start" dominant-baseline="central">格式化字符串：printf 的参数读取顺序</text>
<text x="60" y="127" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="central">x86-64 System V ABI 下，从寄存器到调用栈的取参路径</text>

<!-- Top section: Stack argument area -->
<text x="600" y="185" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">栈上参数区（高地址在上，低地址在下）</text>

<rect x="230" y="215" width="740" height="140" fill="#e8f2ff"/>
<text x="600" y="260" fill="#2366a8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="600" text-anchor="middle" dominant-baseline="central">buf[64]（可控输入起始区）</text>
<text x="600" y="314" fill="#2366a8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">第 k 个 % 起读到用户输入（如 %k$p 读出前 8 字节）</text>

<rect x="230" y="355" width="740" height="70" fill="#f3f6fa"/>
<text x="600" y="390" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">可能存在的其他栈帧数据或对齐填充</text>

<rect x="230" y="425" width="740" height="65" fill="#fff0df"/>
<text x="600" y="457" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="central">栈槽 1 → 第 7 个说明符（%7$p）</text>

<rect x="230" y="490" width="740" height="65" fill="#fff0df"/>
<text x="600" y="522" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="central">栈槽 0 → 第 6 个说明符（%6$p）</text>

<rect x="230" y="215" width="740" height="340" fill="none" stroke="#a8b4c4" stroke-width="2"/>
<line x1="230" y1="355" x2="970" y2="355" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="230" y1="425" x2="970" y2="425" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="230" y1="490" x2="970" y2="490" stroke="#a8b4c4" stroke-width="1.5"/>

<!-- Left upward arrow indicating stack traversal direction -->
<line x1="185" y1="535" x2="185" y2="245" stroke="#b35b0b" stroke-width="5"/>
<polygon points="185,225 173,247 197,247" fill="#b35b0b"/>
<text x="115" y="365" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle" dominant-baseline="central">取参方向</text>
<text x="115" y="402" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">向高地址</text>

<!-- Bottom section: Horizontal register arguments -->
<text x="600" y="612" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">寄存器传递的前 6 个参数位（按顺序从左到右）</text>

<rect x="60" y="640" width="180" height="120" fill="#f3f6fa"/>
<text x="150" y="676" fill="#172b4d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">rdi</text>
<text x="150" y="712" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">格式串地址</text>
<text x="150" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">不计入 %</text>

<rect x="240" y="640" width="180" height="120" fill="#fff0df"/>
<text x="330" y="676" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">rsi</text>
<text x="330" y="712" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">第 1 个 %</text>
<text x="330" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">(%1$p)</text>

<rect x="420" y="640" width="180" height="120" fill="#fff0df"/>
<text x="510" y="676" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">rdx</text>
<text x="510" y="712" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">第 2 个 %</text>
<text x="510" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">(%2$p)</text>

<rect x="600" y="640" width="180" height="120" fill="#fff0df"/>
<text x="690" y="676" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">rcx</text>
<text x="690" y="712" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">第 3 个 %</text>
<text x="690" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">(%3$p)</text>

<rect x="780" y="640" width="180" height="120" fill="#fff0df"/>
<text x="870" y="676" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">r8</text>
<text x="870" y="712" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">第 4 个 %</text>
<text x="870" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">(%4$p)</text>

<rect x="960" y="640" width="180" height="120" fill="#fff0df"/>
<text x="1050" y="676" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">r9</text>
<text x="1050" y="712" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">第 5 个 %</text>
<text x="1050" y="738" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">(%5$p)</text>

<rect x="60" y="640" width="1080" height="120" fill="none" stroke="#a8b4c4" stroke-width="2"/>
<line x1="240" y1="640" x2="240" y2="760" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="420" y1="640" x2="420" y2="760" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="600" y1="640" x2="600" y2="760" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="780" y1="640" x2="780" y2="760" stroke="#a8b4c4" stroke-width="1.5"/>
<line x1="960" y1="640" x2="960" y2="760" stroke="#a8b4c4" stroke-width="1.5"/>

<!-- Elbow arrow from r9 up and left into stack slot 0 -->
<polyline points="1050,640 1050,522 990,522" fill="none" stroke="#b35b0b" stroke-width="4"/>
<polygon points="976,522 994,512 994,532" fill="#b35b0b"/>
<text x="1082" y="575" fill="#b35b0b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">用尽后读栈</text>

<!-- Footer notes -->
<line x1="60" y1="815" x2="1140" y2="815" stroke="#dce3ec" stroke-width="1"/>
<text x="60" y="854" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="central">简化示意：实际进入可变参数函数后寄存器值常会暂存至保存区，但 % 编号顺序不变。</text>
<text x="60" y="890" fill="#52627a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="central">buf 对应的起始参数序号 k、字节对齐和中间栈帧内容，需要结合反汇编与调试确认。</text>
</svg>
